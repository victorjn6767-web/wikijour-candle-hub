name: exp0
on:
  workflow_dispatch:
    inputs:
      sym: { description: 'Symbol label', default: 'XAUUSD' }
      from: { description: 'First UTC date YYYY-MM-DD', default: '2026-10-01' }
      to: { description: 'Last UTC date YYYY-MM-DD', default: '2026-11-10' }
      digits: { description: 'Price decimals', default: '3' }
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYM: ${{ inputs.sym }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      DIGITS: ${{ inputs.digits }}
      DK_PROXY_URL: ${{ secrets.DK_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: unit and end-to-end tests
        run: node --test "test/*.test.js"
      - name: guard (code only, no data, no secrets)
        run: node scripts/guard.js
      - name: "1. first invocation: first half of the range only"
        env: { TO: '2026-10-20', BUDGET_SEC: '1500', PASSES: '3' }
        run: node scripts/fetch.js
      - name: snapshot after invocation 1
        run: node scripts/check-resume.js snapshot
      - name: "2. second invocation: full range (must resume; complete days not requested again)"
        env: { BUDGET_SEC: '2400', PASSES: '4' }
        run: node scripts/fetch.js
      - name: resume check (complete days untouched)
        run: node scripts/check-resume.js compare
      - name: snapshot after invocation 2
        run: node scripts/check-resume.js snapshot
      - name: damage three stored files (truncated, same-size flipped, deleted)
        run: echo "TAMPERED=$(node scripts/tamper.js)" >> "$GITHUB_ENV"
      - name: "3. third invocation: must detect and repair exactly those three days"
        env: { BUDGET_SEC: '900', PASSES: '3' }
        run: node scripts/fetch.js
      - name: repair check (damaged days refetched, all others untouched)
        run: node scripts/check-resume.js compare
      - name: snapshot after invocation 3
        run: node scripts/check-resume.js snapshot
      - name: "4. fourth invocation: nothing to do, zero requests"
        env: { BUDGET_SEC: '300', PASSES: '1', TAMPERED: '' }
        run: node scripts/fetch.js
      - name: idempotence check
        env: { TAMPERED: '' }
        run: node scripts/check-resume.js compare
      - name: analyze (aggregate statistics only)
        run: node scripts/analyze.js
      - name: golden test of WJM1 v1 and independent reader
        run: node --test test/v1-frozen.test.js test/ref-reader.test.js test/wjm1.test.js
