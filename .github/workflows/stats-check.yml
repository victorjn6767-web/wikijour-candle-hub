name: stats-check
on:
  workflow_dispatch:
    inputs:
      from: { description: 'First UTC date', default: '2026-10-12' }
      to: { description: 'Last UTC date', default: '2026-10-17' }
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SYM: XAUUSD
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      BUDGET_SEC: '900'
      PASSES: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: A. proxy only (direct skipped on purpose)
        env: { DK_DIRECT_TRIES: '0', WORK_DIR: work-a, DK_PROXY_URL: '${{ secrets.DK_PROXY_URL }}' }
        run: node scripts/fetch.js
      - name: B. direct only (no proxy configured)
        env: { DK_PROXY_URL: '', WORK_DIR: work-b }
        run: node scripts/fetch.js
